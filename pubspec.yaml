name: strava_client
description: >-
  An unofficial Flutter client for the Strava V3 API: OAuth2 authentication with
  automatic token refresh, typed models, and repository-based endpoints.
version: 2.4.0
homepage: https://github.com/dreampowder/strava_flutter
repository: https://github.com/dreampowder/strava_flutter
issue_tracker: https://github.com/dreampowder/strava_flutter/issues
documentation: https://github.com/dreampowder/strava_flutter#readme
topics:
  - strava
  - fitness
  - oauth
  - http
  - api

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  flutter_web_auth_2: ^5.0.3
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  app_links: ^7.1.1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  flutter_lints: ^5.0.0
  # test: 1.5.3 # To launch some tests in /test

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
